[project]
name = "dqn-atari"
version = "0.1.0"
description = "Deep Q-Network agent trained from scratch on Atari Pong (PyTorch + Gymnasium)"
requires-python = ">=3.11"
dependencies = [
    "ale-py>=0.12.1",
    "gymnasium[atari]>=1.4.0",
    "matplotlib>=3.11.2",
    "moviepy>=2.2.1",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "torch>=2.15.0",
]

[tool.uv]
package = false
